<!DOCTYPE html>
<html lang="vi" ng-app="lapzoneApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LapZone — Cửa hàng laptop chính hãng</title>
    <meta name="description" content="LapZone — Mua laptop chính hãng giá tốt, đa dạng thương hiệu, giao hàng toàn quốc.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top" id="main-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="#!/">
            <i class="bi bi-laptop text-primary"></i> LapZone
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="#!/">Sản phẩm</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" ng-if="!isLoggedIn">
                    <a class="nav-link" href="#!/login"><i class="bi bi-person"></i> Đăng nhập</a>
                </li>
                <li class="nav-item" ng-if="!isLoggedIn">
                    <a class="nav-link" href="#!/register">Đăng ký</a>
                </li>
                <li class="nav-item" ng-if="isLoggedIn">
                    <a class="nav-link text-nowrap" href="#!/cart">
                        <i class="bi bi-cart3"></i> Giỏ hàng
                        <span class="badge bg-danger rounded-pill" ng-if="cartCount > 0">{{cartCount}}</span>
                    </a>
                </li>
                <li class="nav-item dropdown" ng-if="isLoggedIn">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> {{currentUserName}}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#!/profile"><i class="bi bi-person"></i> Hồ sơ</a></li>
                        <li ng-if="isAdmin"><hr class="dropdown-divider"></li>
                        <li ng-if="isAdmin"><a class="dropdown-item" href="#!/admin/categories"><i class="bi bi-grid"></i> Danh mục</a></li>
                        <li ng-if="isAdmin"><a class="dropdown-item" href="#!/admin/products"><i class="bi bi-box"></i> Sản phẩm</a></li>
                        <li ng-if="isAdmin"><a class="dropdown-item" href="#!/admin/orders"><i class="bi bi-receipt"></i> Đơn hàng</a></li>
                        <li ng-if="isAdmin"><a class="dropdown-item" href="#!/admin/users"><i class="bi bi-people"></i> Người dùng</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" ng-click="logout()"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content (AngularJS ng-view) -->
<main class="container-fluid py-4" ng-view></main>

<!-- Footer -->
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-1"><strong>LapZone</strong> — Cửa hàng laptop chính hãng</p>
        <p class="text-muted small mb-0">© 2025 LapZone. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>
<script src="js/app.js"></script>
<script src="js/services/authInterceptor.js"></script>
<script src="js/services/authService.js"></script>
<script src="js/services/categoryService.js"></script>
<script src="js/services/productService.js"></script>
<script src="js/services/cartService.js"></script>
<script src="js/services/orderService.js"></script>
<script src="js/controllers/authController.js"></script>
<script src="js/controllers/mainController.js"></script>
<script src="js/controllers/categoryController.js"></script>
<script src="js/controllers/productController.js"></script>
<script src="js/controllers/cartController.js"></script>
<script src="js/controllers/checkoutController.js"></script>
<script src="js/controllers/orderController.js"></script>
<script src="js/controllers/userController.js"></script>
<script src="js/controllers/adminController.js"></script>
</body>
</html>
