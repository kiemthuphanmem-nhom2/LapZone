<!-- views/cart.html -->
<div class="container mt-4">
  <h2><i class="bi bi-cart3"></i> Giỏ hàng</h2>

  <div class="alert alert-danger" ng-if="cartError">
    {{cartError}}
  </div>

  <div class="alert alert-info" ng-if="!cartError && cartItems.length === 0">
    Giỏ hàng trống. <a href="#!/">Tiếp tục mua sắm</a>
  </div>

  <div ng-if="cartItems.length > 0">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead class="table-light">
          <tr>
            <th style="width:40px"><input type="checkbox" ng-model="selectAll"
                ng-change="toggleSelectAll()"></th>
            <th colspan="2">Sản phẩm</th>
            <th>Đơn giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="item in cartItems">
            <td><input type="checkbox" ng-model="item.selected"></td>
            <td style="width:70px">
              <img ng-src="{{item.image || 'https://placehold.co/60x60?text=SP'}}"
                   width="60" height="60" style="object-fit:cover" alt="">
            </td>
            <td><strong>{{item.productName}}</strong></td>
            <td class="text-primary">{{item.price | number:0}}₫</td>
            <td style="width:110px">
              <input type="number" class="form-control form-control-sm" style="width:80px"
                     ng-model="item.quantity" min="1" max="{{item.stock}}"
                     ng-change="updateQuantity(item)">
            </td>
            <td class="fw-bold">{{(item.price * item.quantity) | number:0}}₫</td>
            <td>
              <button class="btn btn-sm btn-outline-danger" ng-click="removeItem(item.id)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <h5>Tổng cộng: <span class="text-danger fw-bold">
        {{calculateTotal() | number:0}}₫
      </span></h5>
      <button class="btn btn-success px-4" ng-click="goToCheckout()">
        <i class="bi bi-credit-card"></i> Tiến hành thanh toán
      </button>
    </div>
  </div>
</div>
