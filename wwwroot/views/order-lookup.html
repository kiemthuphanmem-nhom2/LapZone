<!-- views/order-lookup.html -->
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title"><i class="bi bi-search"></i> Tra cứu đơn hàng</h3>
          <div class="alert alert-danger" ng-if="error">{{error}}</div>
          <form ng-submit="lookup()">
            <div class="mb-3">
              <label class="form-label">Mã đơn hàng</label>
              <input type="number" class="form-control" ng-model="form.orderId" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Số điện thoại</label>
              <input type="text" class="form-control" ng-model="form.customerPhone" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Tra cứu</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
