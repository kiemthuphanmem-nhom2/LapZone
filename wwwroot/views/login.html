<!-- views/login.html -->
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-4"><i class="bi bi-person-lock"></i> Đăng nhập</h2>
        <div class="alert alert-danger" ng-if="error">{{error}}</div>
        <form ng-submit="login()">
          <div class="mb-3">
            <label class="form-label">Email hoặc Số điện thoại</label>
            <input type="text" class="form-control" ng-model="credentials.emailOrPhone" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" class="form-control" ng-model="credentials.password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" ng-disabled="loading">
            <span ng-if="loading"><i class="bi bi-hourglass-split"></i> Đang đăng nhập...</span>
            <span ng-if="!loading">Đăng nhập</span>
          </button>
        </form>
        <p class="text-center mt-3 mb-0">Chưa có tài khoản? <a href="#!/register">Đăng ký ngay</a></p>
      </div>
    </div>
  </div>
</div>
