<!-- views/profile.html -->
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3><i class="bi bi-person-circle"></i> Hồ sơ của tôi</h3>
          <div class="alert alert-success" ng-if="success">{{success}}</div>
          <div class="alert alert-danger" ng-if="error">{{error}}</div>
          <form ng-submit="save()">
            <div class="mb-3">
              <label class="form-label">Họ tên</label>
              <input type="text" class="form-control"
                     ng-model="profile.fullName" ng-init="profile.fullName = profile.fullName || profile.full_name">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" ng-model="profile.email" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">Số điện thoại</label>
              <input type="text" class="form-control" ng-model="profile.phone">
            </div>
            <div class="mb-3">
              <label class="form-label">Địa chỉ</label>
              <textarea class="form-control" ng-model="profile.address" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
