<!-- views/admin/users.html -->
<div class="container-fluid mt-4">
  <h3><i class="bi bi-people"></i> Quản lý Người dùng</h3>
  <form ng-submit="search()" class="row g-2 mt-2 mb-3">
    <div class="col-md-4">
      <input type="text" class="form-control" placeholder="Tìm theo tên, email, SĐT..." ng-model="keyword">
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Tìm</button>
    </div>
  </form>
  <div class="table-responsive">
    <table class="table table-bordered table-sm">
      <thead class="table-dark">
        <tr><th>ID</th><th>Họ tên</th><th>Email</th><th>SĐT</th><th>Vai trò</th><th>Thao tác</th></tr>
      </thead>
      <tbody>
        <tr ng-repeat="u in users">
          <td>{{u.id}}</td>
          <td>{{u.fullName || u.full_name}}</td>
          <td>{{u.email}}</td>
          <td>{{u.phone}}</td>
          <td>
            <select class="form-select form-select-sm" ng-model="u.role" ng-change="updateRole(u)">
              <option value="USER">USER</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </td>
          <td>
            <button class="btn btn-sm btn-danger" ng-click="remove(u.id)"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav ng-if="totalPages > 1">
    <ul class="pagination">
      <li class="page-item" ng-class="{disabled: page===0}">
        <a class="page-link" href="#" ng-click="goPage(page-1)">«</a>
      </li>
      <li class="page-item active"><span class="page-link">{{page+1}}/{{totalPages}}</span></li>
      <li class="page-item" ng-class="{disabled: page>=totalPages-1}">
        <a class="page-link" href="#" ng-click="goPage(page+1)">»</a>
      </li>
    </ul>
  </nav>
</div>
