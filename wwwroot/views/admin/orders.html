<!-- views/admin/orders.html -->
<div class="container-fluid mt-4">
  <h3><i class="bi bi-receipt"></i> Quản lý Đơn hàng</h3>
  <!-- Filter -->
  <form ng-submit="search()" class="row g-2 mt-2 mb-3">
    <div class="col-md-4">
      <input type="text" class="form-control" placeholder="Tìm kiếm theo tên, SĐT, mã đơn..." ng-model="filter.keyword">
    </div>
    <div class="col-md-3">
      <select class="form-select" ng-model="filter.status">
        <option value="">-- Tất cả trạng thái --</option>
        <option ng-repeat="s in statuses" value="{{s}}">{{s}}</option>
      </select>
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Tìm</button>
    </div>
  </form>
  <!-- Table -->
  <div class="table-responsive">
    <table class="table table-bordered table-sm">
      <thead class="table-dark">
        <tr><th>#</th><th>Ngày đặt</th><th>Khách hàng</th><th>SĐT</th><th>Tổng tiền</th><th>Trạng thái</th></tr>
      </thead>
      <tbody>
        <tr ng-repeat="o in orders">
          <td><a href="#!/orders/{{o.id}}">{{o.id}}</a></td>
          <td>{{o.orderDate | date:'dd/MM/yyyy HH:mm'}}</td>
          <td>{{o.customerName}}</td>
          <td>{{o.customerPhone}}</td>
          <td>{{o.totalAmount | number:0}}₫</td>
          <td>
            <select class="form-select form-select-sm" ng-model="o.status" ng-change="updateStatus(o)">
              <option ng-repeat="s in statuses" value="{{s}}">{{s}}</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- Pagination -->
  <nav ng-if="totalPages > 1">
    <ul class="pagination">
      <li class="page-item" ng-class="{disabled: page===0}">
        <a class="page-link" href="#" ng-click="goPage(page-1)">«</a>
      </li>
      <li class="page-item active"><span class="page-link">{{page+1}}/{{totalPages}}</span></li>
      <li class="page-item" ng-class="{disabled: page>=totalPages-1}">
        <a class="page-link" href="#" ng-click="goPage(page+1)">»</a>
      </li>
    </ul>
  </nav>
</div>
