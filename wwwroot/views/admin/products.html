<!-- views/admin/products.html -->
<div class="container-fluid mt-4">
  <h3><i class="bi bi-box"></i> Quản lý Sản phẩm</h3>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div></div>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#productModal" ng-click="newProduct()">
      <i class="bi bi-plus-lg"></i> Thêm sản phẩm
    </button>
  </div>
  <div class="table-responsive">
    <table class="table table-bordered table-sm">
      <thead class="table-dark">
        <tr><th>ID</th><th>Tên</th><th>Giá</th><th>Tồn kho</th><th>Thao tác</th></tr>
      </thead>
      <tbody>
        <tr ng-repeat="p in products">
          <td>{{p.id}}</td>
          <td><img ng-src="{{p.image || 'https://placehold.co/40'}}" width="40" class="me-1">{{p.name}}</td>
          <td>{{p.price | number:0}}₫</td>
          <td>{{p.stock}}</td>
          <td>
            <button class="btn btn-sm btn-warning me-1" data-bs-toggle="modal" data-bs-target="#productModal" ng-click="edit(p)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-danger" ng-click="remove(p.id)"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav ng-if="totalPages > 1">
    <ul class="pagination">
      <li class="page-item" ng-class="{disabled: page===0}">
        <a class="page-link" href="#" ng-click="goPage(page-1)">«</a>
      </li>
      <li class="page-item active"><span class="page-link">{{page+1}}/{{totalPages}}</span></li>
      <li class="page-item" ng-class="{disabled: page>=totalPages-1}">
        <a class="page-link" href="#" ng-click="goPage(page+1)">»</a>
      </li>
    </ul>
  </nav>

  <!-- Modal thêm/sửa sản phẩm -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{form.id ? 'Cập nhật sản phẩm' : 'Thêm sản phẩm mới'}}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">Tên sản phẩm</label>
              <input type="text" class="form-control" ng-model="form.name">
            </div>
            <div class="col-md-4">
              <label class="form-label">Danh mục</label>
              <select class="form-select" ng-model="form.categoryId">
                <option ng-repeat="c in categories" value="{{c.id}}">{{c.name}}</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Giá (₫)</label>
              <input type="number" class="form-control" ng-model="form.price">
            </div>
            <div class="col-md-4">
              <label class="form-label">Tồn kho</label>
              <input type="number" class="form-control" ng-model="form.stock">
            </div>
            <div class="col-md-12">
              <label class="form-label">URL ảnh</label>
              <input type="text" class="form-control" ng-model="form.image">
            </div>
            <div class="col-md-4"><label class="form-label">CPU</label><input type="text" class="form-control" ng-model="form.cpu"></div>
            <div class="col-md-4"><label class="form-label">RAM</label><input type="text" class="form-control" ng-model="form.ram"></div>
            <div class="col-md-4"><label class="form-label">Ổ cứng</label><input type="text" class="form-control" ng-model="form.storage"></div>
            <div class="col-md-4"><label class="form-label">GPU</label><input type="text" class="form-control" ng-model="form.gpu"></div>
            <div class="col-md-4"><label class="form-label">Màn hình</label><input type="text" class="form-control" ng-model="form.screen"></div>
            <div class="col-md-4"><label class="form-label">Pin</label><input type="text" class="form-control" ng-model="form.battery"></div>
            <div class="col-md-4"><label class="form-label">Bảo hành</label><input type="text" class="form-control" ng-model="form.warranty"></div>
            <div class="col-md-4"><label class="form-label">Màu sắc</label><input type="text" class="form-control" ng-model="form.color"></div>
            <div class="col-md-4"><label class="form-label">Khối lượng</label><input type="text" class="form-control" ng-model="form.weight"></div>
            <div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" ng-model="form.moreInfo" rows="3"></textarea></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-primary" ng-click="save()" data-bs-dismiss="modal">Lưu</button>
        </div>
      </div>
    </div>
  </div>
</div>
